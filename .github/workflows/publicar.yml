name: Publicar Arcade Excel V12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Recuperar documentos originales de subcarpetas
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile("ORIGINAL_V12.zip") as z:
              for name in ["ARCHIVOS_PROPIOS/LEEME_CHEX3.txt", "juegos/enemy-territory/LEEME.txt", "juegos/freedoom/PON_AQUI_ARCHIVOS_DEL_INSTALADOR.txt"]:
                  path = Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(name))
          PYTHON
      - name: Incorporar motores y campañas completas
        run: python3 PREPARAR_SITIO.py
      - name: Comprobar recursos empaquetados
        run: |
          test -s juegos/freedoom/websockets-doom.wasm
          test -s juegos/freedoom2/websockets-doom.wasm
          test -s juegos/freedoom/freedoom1.wad
          test -s juegos/freedoom2/freedoom2.wad
      - name: Preparar carpeta pública
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r juegos _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
